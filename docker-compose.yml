name: holly-manager

x-backend: &backend
  build:
    context: ./backend
    target: worker
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://holly:holly@postgres:5432/holly
    REDIS_URL: redis://redis:6379/0
    OLLAMA_API_BASE: http://ollama:11434
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage
    # Código montado en desarrollo: basta con reiniciar el servicio tras un cambio
    - ./backend/app:/app/app
    - ./backend/alembic:/app/alembic
    - ./backend/seed_docs:/app/seed_docs
    - ./backend/docs:/app/docs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: holly
      POSTGRES_PASSWORD: holly
      POSTGRES_DB: holly
    ports: ["${PG_PORT:-5434}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holly"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6380}:6379"]

  ollama:
    image: ollama/ollama:latest
    ports: ["${OLLAMA_PORT:-11600}:11434"]
    volumes: [ollama:/root/.ollama]

  # Descarga una vez los modelos locales (fallback de chat + embeddings)
  ollama-init:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text && ollama pull qwen2.5:7b"]
    volumes: [ollama:/root/.ollama]
    restart: "no"

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports:
      - "${JAEGER_UI_PORT:-16687}:16686"   # UI
      - "${OTLP_PORT:-4327}:4317"     # OTLP gRPC

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["${API_PORT:-8010}:8000"]

  worker:
    <<: *backend
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  flower:
    <<: *backend
    command: celery -A app.worker flower --port=5555
    ports: ["${FLOWER_PORT:-5555}:5555"]

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-5174}:5173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      VITE_API_PROXY: http://api:8000
      WATCH_POLLING: "1"
    depends_on: [api]

volumes:
  pgdata:
  ollama:
  storage:
